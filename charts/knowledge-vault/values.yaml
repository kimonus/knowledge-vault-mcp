replicaCount: 1

image:
  repository: ghcr.io/kimonus/knowledge-vault-mcp
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

backupImage:
  repository: ghcr.io/kimonus/knowledge-vault-mcp-backup
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  environment: production
  publicBaseUrl: ""
  authIssuerUrl: ""
  ingestionPolicyVersion: "1"
  # null uses the complete extraction policy packaged in the application. A non-empty string
  # replaces only operator guidance; fixed safety, batching and readback rules stay in code.
  ingestionPolicy: null
  embeddingsEnabled: true
  embeddingModel: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  embeddingDimensions: 384
  logLevel: INFO
  corsOrigins: ""
  maxRequestBytes: 2000000
  maxBatchItems: 1000
  maxPartItems: 100

auth:
  existingSecret: ""
  tokenPepperKey: token-pepper
  bootstrapTokensKey: bootstrap-tokens

cloudflareAccess:
  enabled: false
  existingSecret: ""
  # Hostname(s) published through the edge. Required when enabled: requests for these hosts
  # are refused without a valid signed Access assertion.
  publicHosts: []
  # Optional allowlist of private hostnames. When non-empty, device bearer tokens are accepted
  # only for these hosts and every other hostname requires an assertion.
  privateHosts: []
  issuerUrlKey: issuer-url
  audienceKey: audience
  allowedEmailsKey: allowed-emails
  scopes: knowledge:read,knowledge:write

database:
  existingSecret: ""
  urlKey: database-url

modelCache:
  existingClaim: ""

resources:
  api:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  worker:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  migration:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  init:
    requests: {cpu: 25m, memory: 96Mi}
    limits: {cpu: 250m, memory: 256Mi}

worker:
  metricsPort: 9102

service:
  port: 8000

ingress:
  enabled: false
  # Required when enabled; name the ingress class of a maintained controller in your cluster.
  className: ""
  host: ""
  tlsSecret: ""
  # Only client-facing paths are routed. Health, metrics, and the OpenAPI document stay
  # reachable inside the cluster only.
  paths: [/mcp, /api/v1, /.well-known]
  annotations: {}

internalPostgresql:
  enabled: false
  image:
    repository: pgvector/pgvector
    tag: 0.8.1-pg17-trixie
    digest: sha256:137f044b0efe3d57f39b972b9b53641b1f2045b99d879e298bbf514a25787dcf
  existingSecret: ""
  usernameKey: username
  passwordKey: password
  databaseKey: database
  storageClass: ""
  storage: 20Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

cloudflareTunnel:
  enabled: false
  replicaCount: 2
  image:
    repository: cloudflare/cloudflared
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  existingSecret: ""
  tokenKey: token
  logLevel: info
  metricsPort: 2000
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}

backup:
  enabled: false
  schedule: "17 2 * * *"
  existingSecret: ""
  databaseUrlKey: database-url
  repositoryKey: repository
  passwordKey: password
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 6
  checkSubset: 5%
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

networkPolicy:
  enabled: true
  # Peers allowed to reach the API on port 8000. The default admits any namespace so that an
  # ingress controller works out of the box; narrow it to the controller's namespace.
  # Cloudflared Pods of this release are always admitted when the tunnel is enabled.
  apiIngressFrom:
    - namespaceSelector: {}
  # Peers allowed to scrape worker metrics. Empty denies all ingress to the worker.
  metricsIngressFrom: []
  # Extra egress rules for the API and worker Pods.
  additionalEgress: []
  # Egress rules that let the backup Job reach its restic repository.
  backupEgress:
    - ports: [{protocol: TCP, port: 443}]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
