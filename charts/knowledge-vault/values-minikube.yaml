# Images built locally inside the Minikube Docker daemon (see docs/runbooks/minikube.md).
image:
  repository: knowledge-vault
backupImage:
  repository: knowledge-vault-backup
config:
  publicBaseUrl: https://KNOWLEDGE_VAULT_LAN_HOST
  authIssuerUrl: https://KNOWLEDGE_VAULT_LAN_HOST
auth:
  existingSecret: knowledge-vault-auth
database:
  existingSecret: knowledge-vault-database
internalPostgresql:
  enabled: true
  existingSecret: knowledge-vault-postgres
  storage: 20Gi
ingress:
  enabled: false
backup:
  enabled: false
