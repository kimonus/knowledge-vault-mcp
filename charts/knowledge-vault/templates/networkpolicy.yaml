{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "knowledge-vault.fullname" . }}
  labels: {{- include "knowledge-vault.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "knowledge-vault.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports: [{protocol: TCP, port: 5432}]
    {{- with .Values.networkPolicy.additionalEgress }}{{ toYaml . | nindent 4 }}{{- end }}
{{- end }}
