{{- include "knowledge-vault.requirements" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "knowledge-vault.fullname" . }}
  labels:
    {{- include "knowledge-vault.labels" . | nindent 4 }}
data:
  KNOWLEDGE_VAULT_ENVIRONMENT: {{ .Values.config.environment | quote }}
  KNOWLEDGE_VAULT_PUBLIC_BASE_URL: {{ .Values.config.publicBaseUrl | quote }}
  KNOWLEDGE_VAULT_AUTH_ISSUER_URL: {{ .Values.config.authIssuerUrl | quote }}
  KNOWLEDGE_VAULT_EMBEDDINGS_ENABLED: {{ .Values.config.embeddingsEnabled | quote }}
  KNOWLEDGE_VAULT_EMBEDDING_MODEL: {{ .Values.config.embeddingModel | quote }}
  KNOWLEDGE_VAULT_EMBEDDING_DIMENSIONS: {{ .Values.config.embeddingDimensions | quote }}
  KNOWLEDGE_VAULT_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  KNOWLEDGE_VAULT_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  KNOWLEDGE_VAULT_MAX_REQUEST_BYTES: {{ .Values.config.maxRequestBytes | quote }}
  KNOWLEDGE_VAULT_MAX_BATCH_ITEMS: {{ .Values.config.maxBatchItems | quote }}
  KNOWLEDGE_VAULT_MAX_PART_ITEMS: {{ .Values.config.maxPartItems | quote }}
