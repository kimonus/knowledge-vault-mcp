apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knowledge-vault.fullname" . }}-api
  labels: {{- include "knowledge-vault.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knowledge-vault.fullname" . }}-worker
  labels: {{- include "knowledge-vault.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knowledge-vault.fullname" . }}-ops
  labels: {{- include "knowledge-vault.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.cloudflareTunnel.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knowledge-vault.fullname" . }}-cloudflared
  labels: {{- include "knowledge-vault.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
