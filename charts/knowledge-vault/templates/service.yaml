apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledge-vault.fullname" . }}
  labels: {{- include "knowledge-vault.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "knowledge-vault.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
