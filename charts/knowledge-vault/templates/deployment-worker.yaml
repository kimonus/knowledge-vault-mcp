apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge-vault.fullname" . }}-worker
  labels: {{- include "knowledge-vault.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "knowledge-vault.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "knowledge-vault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "knowledge-vault.fullname" . }}-worker
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: wait-for-migration
          image: {{ include "knowledge-vault.image" .Values.image }}
          command: ["/bin/sh", "-ec"]
          args: ["until alembic current 2>/dev/null | grep -q 0001_initial; do sleep 2; done"]
          env:
            - name: KNOWLEDGE_VAULT_ENVIRONMENT
              value: development
            - name: KNOWLEDGE_VAULT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.urlKey }}}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
      containers:
        - name: worker
          image: {{ include "knowledge-vault.image" .Values.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["knowledge-vault-worker"]
          envFrom:
            - configMapRef: {name: {{ include "knowledge-vault.fullname" . }}}
          env:
            - name: KNOWLEDGE_VAULT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.urlKey }}}}
            - name: KNOWLEDGE_VAULT_TOKEN_PEPPER
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.existingSecret }}, key: {{ .Values.auth.tokenPepperKey }}}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.modelCache.existingClaim }}
            - {name: model-cache, mountPath: /models, readOnly: true}
            {{- end }}
          resources: {{- toYaml .Values.resources.worker | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        {{- if .Values.modelCache.existingClaim }}
        - name: model-cache
          persistentVolumeClaim: {claimName: {{ .Values.modelCache.existingClaim }}}
        {{- end }}
      terminationGracePeriodSeconds: 60
