apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge-vault.fullname" . }}-worker
  labels: {{- include "knowledge-vault.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "knowledge-vault.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "knowledge-vault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "knowledge-vault.fullname" . }}-worker
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        {{- include "knowledge-vault.waitForMigration" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "knowledge-vault.image" .Values.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["knowledge-vault-worker"]
          ports: [{name: metrics, containerPort: {{ .Values.worker.metricsPort }}, protocol: TCP}]
          envFrom:
            - configMapRef: {name: {{ include "knowledge-vault.fullname" . }}}
          env:
            - name: KNOWLEDGE_VAULT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret | quote }}, key: {{ .Values.database.urlKey | quote }}}}
            - name: KNOWLEDGE_VAULT_TOKEN_PEPPER
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.existingSecret | quote }}, key: {{ .Values.auth.tokenPepperKey | quote }}}}
            - name: KNOWLEDGE_VAULT_WORKER_METRICS_PORT
              value: {{ .Values.worker.metricsPort | int64 | quote }}
            {{- include "knowledge-vault.modelEnv" . | nindent 12 }}
            {{- include "knowledge-vault.extraEnv" . | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.modelCache.existingClaim }}
            - {name: model-cache, mountPath: /models, readOnly: true}
            {{- end }}
          # The metrics listener runs in the worker process, so it also proves liveness.
          livenessProbe: {tcpSocket: {port: metrics}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {{- toYaml .Values.resources.worker | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        {{- if .Values.modelCache.existingClaim }}
        - name: model-cache
          persistentVolumeClaim: {claimName: {{ .Values.modelCache.existingClaim | quote }}}
        {{- end }}
      terminationGracePeriodSeconds: 60
      {{- include "knowledge-vault.scheduling" . | nindent 6 }}
