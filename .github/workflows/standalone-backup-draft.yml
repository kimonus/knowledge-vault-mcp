name: Standalone backup draft

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - run: sh scripts/ci/standalone_backup_draft.sh
