worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 2m;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/kv-secrets/tls-cert.pem;
        ssl_certificate_key /run/kv-secrets/tls-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        # MCP streamable HTTP can remain idle between server events.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        location = /mcp { proxy_pass http://api:8000; }
        location ^~ /api/v1/ { proxy_pass http://api:8000; }
        location / { return 404; }
    }
}
