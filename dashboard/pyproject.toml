[project]
name = "knowledge-vault-dashboard"
version = "0.1.0"
description = "Isolated read-only Knowledge Vault browser boundary"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "jsonschema==4.26.0",
  "uvicorn==0.52.4",
]

[project.scripts]
knowledge-vault-dashboard = "knowledge_vault_dashboard.main:run"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.1,<2", "pytest-cov>=6.2,<7", "ruff>=0.12,<1", "pyright>=1.1.404,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.coverage.run]
branch = true
source = ["knowledge_vault_dashboard"]

[tool.coverage.report]
fail_under = 90
show_missing = true
